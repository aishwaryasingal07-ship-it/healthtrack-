{% extends "base.html" %}

{% block title %}Sign In - HealthTrack AI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2.5rem auto;">
    <div class="card" style="box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="brand-icon" style="margin: 0 auto 0.75rem auto; width: 44px; height: 44px; font-size: 1.4rem;">⚕</div>
            <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--text-main);">Welcome Back</h1>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.25rem;">
                Sign in to access your personal healthcare analyzer.
            </p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <!-- CSRF Protection Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email|default('') }}" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; font-size: 1rem; padding: 0.85rem;">
                🔑 Sign In to HealthTrack
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1rem;">
            Don't have an account yet? <a href="{{ url_for('signup') }}" style="color: var(--teal); font-weight: 600; text-decoration: none;">Create a private account</a>
        </div>
    </div>
</div>
{% endblock %}
